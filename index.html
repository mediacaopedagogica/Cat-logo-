<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfólio de Design Educacional — Keise Pâmela Morais</title>
<style>
:root{
  --ink:#27253f; --muted:#69677e; --paper:#fffdf8; --line:rgba(39,37,63,.10);
  --rose:#f46f9d; --lav:#9c6cda; --shadow:0 30px 80px rgba(38,31,68,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);
background:radial-gradient(circle at 15% 10%,#f7dff0,transparent 31%),radial-gradient(circle at 86% 14%,#dbe9ff,transparent 31%),linear-gradient(135deg,#eee8ff,#fff8f0 55%,#e6f2ff)}
button,a{font:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}
.bar{max-width:1500px;width:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:10px;align-items:center;font-weight:900}
.dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#f46f9d,#9c6cda);box-shadow:0 0 0 6px rgba(156,108,218,.12)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 8px 26px rgba(38,31,68,.08)}
.btn:disabled{opacity:.35;cursor:default}
.stage{min-height:0;display:grid;place-items:center;perspective:2600px;overflow:visible}
.magazine{position:relative;width:min(94vw,1500px);height:min(79vh,850px);transform-style:preserve-3d}
.magazine::before{content:"";position:absolute;inset:12px -8px -15px 8px;border-radius:28px;background:#e7dfd2;z-index:-3;box-shadow:0 25px 60px rgba(38,31,68,.16)}
.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);border:1px solid rgba(39,37,63,.08)}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);pointer-events:none;z-index:12;background:linear-gradient(90deg,rgba(20,15,44,.11),rgba(255,255,255,.25) 35%,rgba(20,15,44,.07) 70%,transparent)}
.half{position:relative;min-width:0;overflow:hidden;background:var(--paper)}
.half.left{box-shadow:inset -18px 0 28px rgba(35,27,58,.055)}
.half.right{box-shadow:inset 18px 0 28px rgba(35,27,58,.045)}
.leaf{position:absolute;top:0;bottom:0;width:50%;right:0;z-index:30;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;visibility:hidden}
.leaf.active{visibility:visible}
.leaf-face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper);box-shadow:inset 18px 0 30px rgba(35,27,58,.055)}
.leaf-back{transform:rotateY(180deg);box-shadow:inset -18px 0 30px rgba(35,27,58,.06)}
.leaf::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(25,18,45,.02),transparent 35%,rgba(25,18,45,.18));opacity:0;transition:opacity .18s ease}
.leaf.active::after{opacity:.9}
.leaf.soft{transition:transform .92s cubic-bezier(.18,.74,.16,1),filter .92s ease}
.paper-flex{position:absolute;top:0;bottom:0;width:8%;right:-1%;z-index:35;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),rgba(45,32,70,.08));filter:blur(.2px);opacity:0}
.leaf.active .paper-flex{opacity:.75}
.page{height:100%;position:relative;overflow:hidden;background:#fffdf8}
.page-no{position:absolute;bottom:18px;font:800 .72rem/1 Georgia,serif;color:#7c798b;letter-spacing:.12em;z-index:5}
.left .page-no{left:24px} .right .page-no{right:24px}
.kicker{font-size:.72rem;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:#8960c3;margin-bottom:12px}
.copy{padding:clamp(24px,3.3vw,54px);height:100%;display:flex;flex-direction:column;justify-content:center}
.copy h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,3.6vw,4.2rem);line-height:.95;letter-spacing:-.04em;margin:0 0 16px}
.copy p{font-size:clamp(.88rem,1.05vw,1.06rem);line-height:1.6;color:#555268;margin:.35em 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}
.chip{background:#f2edf9;border:1px solid #e1d6f2;border-radius:999px;padding:7px 10px;font-size:.76rem;font-weight:850}
.cover{height:100%;display:grid;grid-template-rows:1fr auto;background:linear-gradient(145deg,#eee2ff,#ffdce7 50%,#ddebff)}
.cover-img{min-height:0;position:relative;overflow:hidden}
.cover-img img{width:100%;height:100%;object-fit:cover;object-position:left center;filter:saturate(.9) contrast(.96)}
.cover-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(40,27,70,.15))}
.cover-copy{padding:26px 30px 30px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.8)}
.cover-copy h1{font-size:clamp(2.2rem,4.4vw,5.2rem);line-height:.88;letter-spacing:-.055em;margin:0}
.cover-copy h1 span{display:block;color:#ee6798}
.cover-copy p{margin:12px 0 0;line-height:1.55;color:#515066}
.photo{height:100%;display:grid;place-items:center;padding:clamp(12px,1.7vw,24px);background:linear-gradient(145deg,#f1eef6,#fff6f7)}
.photo img{width:100%;height:100%;object-fit:contain;border-radius:14px;box-shadow:0 18px 42px rgba(33,27,58,.16);background:white}
.about-card{height:100%;padding:clamp(28px,4vw,62px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#f9e4ed,#eee6ff 58%,#e5f1ff)}
.about-card .quote{font-family:Georgia,serif;font-size:clamp(2.2rem,4vw,4.7rem);line-height:.92;margin:0 0 18px}
.about-card p{line-height:1.65;color:#56546a}
.dark{background:linear-gradient(140deg,#17192e,#2b2351 58%,#50306c);color:white}
.dark .kicker{color:#e5b8ff} .dark p{color:#e5def2}
.principles{display:grid;gap:10px;margin-top:16px}
.principle{padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.13);line-height:1.45}
.principle b{display:block;color:#ffd0e2;margin-bottom:3px}
.contact{height:100%;padding:clamp(28px,4vw,62px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#fffaf5,#eee6ff 65%,#e4f0ff)}
.contact h2{font-family:Georgia,serif;font-size:clamp(2.4rem,4vw,4.8rem);line-height:.92;margin:0 0 20px}
.contact-row{padding:13px 0;border-bottom:1px solid var(--line)}
.contact-row small{display:block;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#8967b5;margin-bottom:4px}
.contact-row a{font-weight:900;color:var(--ink);text-decoration:none;word-break:break-word}
.progress{height:5px;flex:1;max-width:420px;background:rgba(39,37,63,.10);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#f46f9d,#9c6cda);width:25%;transition:width .35s ease}
.hint{font-size:.76rem;color:#66647a;font-weight:750}

@media (max-width:900px){
 .app{padding:7px;gap:6px}
 .magazine{width:96vw;height:82vh}
 .spread{grid-template-columns:1fr}
 .half.left{display:none}
 .spread::after{display:none}
 .leaf{width:100%;right:0;transform-origin:left center}
 .copy{padding:24px}
 .copy h2{font-size:2.35rem}
 .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.leaf.soft{transition:none}}

/* V3 — virada de folha orgânica */
.leaf{
  --turn:0;
  --bend:0px;
  --lift:0px;
  --skew:0deg;
  --shade:.05;
  --glow:.05;
  --curlX:100%;
  overflow:visible;
  will-change:transform,filter;
}
.leaf-face{
  overflow:hidden;
  will-change:transform,clip-path,filter;
}
.leaf.active{
  filter:drop-shadow(calc(-22px * var(--turn)) calc(10px * var(--turn)) calc(22px + 28px * var(--turn)) rgba(28,20,48,calc(.10 + .24 * var(--turn))));
}
.leaf.active .leaf-face{
  clip-path:polygon(
    0 0,
    calc(100% - var(--bend)) 0,
    100% calc(7% + 7% * var(--turn)),
    calc(100% - var(--bend) * .25) 50%,
    100% calc(93% - 7% * var(--turn)),
    calc(100% - var(--bend)) 100%,
    0 100%
  );
}
.leaf.active .leaf-front{
  transform:translateZ(calc(1px + 10px * var(--turn))) skewY(var(--skew));
}
.leaf.active .leaf-back{
  transform:rotateY(180deg) translateZ(calc(1px + 10px * var(--turn))) skewY(calc(var(--skew) * -1));
}
.leaf::before{
  content:"";
  position:absolute;
  z-index:44;
  top:0;bottom:0;
  width:clamp(28px,7vw,105px);
  right:calc(-4px + var(--bend) * -.10);
  pointer-events:none;
  opacity:calc(.12 + .82 * var(--turn));
  transform:translateZ(24px) translateX(calc(-1 * var(--bend) * .18));
  border-radius:48% 4px 4px 48%;
  background:
    linear-gradient(90deg,
      rgba(24,17,43,.22),
      rgba(255,255,255,.62) 34%,
      rgba(255,255,255,.10) 57%,
      rgba(25,18,44,.20) 100%);
  filter:blur(calc(.2px + 1.4px * var(--turn)));
  mix-blend-mode:multiply;
}
.leaf::after{
  content:"";
  position:absolute;
  inset:-2% -3% -2% 58%;
  z-index:43;
  pointer-events:none;
  opacity:calc(.08 + .62 * var(--turn));
  transform:translateZ(18px);
  background:
    radial-gradient(ellipse at 100% 50%,
      rgba(255,255,255,.78) 0 10%,
      rgba(255,255,255,.20) 22%,
      rgba(38,27,61,.13) 46%,
      transparent 70%);
}
.paper-flex{
  width:clamp(42px,9vw,132px);
  right:calc(-8px - var(--bend) * .05);
  opacity:calc(.12 + .75 * var(--turn)) !important;
  transform:translateZ(28px) translateX(calc(-1 * var(--bend) * .12)) skewY(var(--skew));
  border-radius:55% 0 0 55%;
  background:
    linear-gradient(90deg,
      transparent 0,
      rgba(255,255,255,.68) 30%,
      rgba(255,255,255,.20) 52%,
      rgba(30,22,50,.15) 76%,
      transparent 100%);
  filter:blur(calc(.4px + .8px * var(--turn)));
}
.magazine::after{
  content:"";
  position:absolute;
  left:50%;top:2%;bottom:2%;width:16px;
  transform:translateX(-50%);
  z-index:25;pointer-events:none;
  background:linear-gradient(90deg,rgba(28,20,46,.10),rgba(255,255,255,.42),rgba(28,20,46,.08));
  filter:blur(2px);
  opacity:.8;
}
@media (max-width:900px){
  .leaf.active .leaf-face{
    clip-path:polygon(0 0,calc(100% - var(--bend)) 0,100% 10%,calc(100% - var(--bend)*.22) 50%,100% 90%,calc(100% - var(--bend)) 100%,0 100%);
  }
}


/* V4 — direção de arte editorial + folha mais macia */
:root{
  --paper-warm:#fffaf3;
  --paper-cool:#f7f5ff;
  --paper-shadow:rgba(39,31,61,.12);
}
.spread{
  background:
    radial-gradient(circle at 12% 18%,rgba(245,111,157,.08),transparent 26%),
    radial-gradient(circle at 82% 10%,rgba(156,108,218,.08),transparent 24%),
    linear-gradient(135deg,#fffdf9,#fffaf6 55%,#fbf8ff);
}
.half{
  background:
    linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.3)),
    repeating-linear-gradient(0deg,rgba(50,43,72,.018) 0 1px,transparent 1px 4px),
    var(--paper-warm);
}
.half::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 75% 15%,rgba(245,111,157,.055),transparent 22%),
    radial-gradient(circle at 78% 80%,rgba(156,108,218,.05),transparent 26%);
  mix-blend-mode:screen;
}
.copy{
  position:relative;
  z-index:2;
}
.copy::after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-65px;top:12%;
  border-radius:38% 62% 55% 45% / 52% 38% 62% 48%;
  background:linear-gradient(135deg,rgba(244,111,157,.12),rgba(156,108,218,.10));
  filter:blur(.2px);
  z-index:-1;
}
.dark .copy::after{
  background:linear-gradient(135deg,rgba(255,180,214,.13),rgba(195,158,255,.10));
}
.photo{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.85),transparent 24%),
    linear-gradient(145deg,#efe9f7,#fff7f8 48%,#eef5ff);
}
.photo::before,
.photo::after{
  content:"";
  position:absolute;
  border-radius:45% 55% 58% 42% / 42% 48% 52% 58%;
  filter:blur(0);
  pointer-events:none;
}
.photo::before{
  width:34%;height:34%;
  left:-8%;top:-8%;
  background:linear-gradient(135deg,rgba(245,111,157,.18),rgba(156,108,218,.08));
  transform:rotate(-13deg);
}
.photo::after{
  width:29%;height:29%;
  right:-8%;bottom:-9%;
  background:linear-gradient(135deg,rgba(164,204,255,.20),rgba(156,108,218,.08));
  transform:rotate(18deg);
}
.photo img{
  position:relative;
  z-index:3;
  width:88%;
  height:86%;
  object-fit:contain;
  border-radius:22px;
  transform:rotate(-1.5deg) perspective(1400px) rotateY(-2deg) rotateX(.8deg);
  box-shadow:
    0 26px 54px rgba(33,27,58,.18),
    0 3px 0 rgba(255,255,255,.72) inset;
  clip-path:polygon(1.2% 2%,98.5% 0,100% 96.8%,97.5% 99%,2% 98.5%,0 3.5%);
}
.photo .detail-orbit{
  position:absolute;
  z-index:4;
  width:23%;
  aspect-ratio:1;
  right:4.5%;
  top:8%;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 18px 35px rgba(35,29,59,.14);
  overflow:hidden;
  transform:rotate(4deg);
}
.photo .detail-orbit img{
  width:160%;
  height:160%;
  max-width:none;
  object-fit:cover;
  border-radius:0;
  transform:translate(-24%,-18%);
  box-shadow:none;
  clip-path:none;
}
.photo .editorial-label{
  position:absolute;
  z-index:5;
  left:5%;
  bottom:5%;
  max-width:44%;
  padding:10px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.95);
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  box-shadow:0 10px 26px rgba(37,30,60,.10);
}
.cover{
  position:relative;
  overflow:hidden;
}
.cover::before{
  content:"";
  position:absolute;
  inset:auto -8% -12% auto;
  width:48%;height:48%;
  border-radius:54% 46% 34% 66% / 43% 58% 42% 57%;
  background:linear-gradient(135deg,rgba(255,255,255,.46),rgba(156,108,218,.10));
  transform:rotate(-14deg);
  z-index:1;
}
.cover-copy{position:relative;z-index:3}
.cover-img img{
  transform:scale(1.035) rotate(.3deg);
  clip-path:polygon(0 0,100% 0,100% 90%,93% 100%,7% 98%,0 90%);
}
.about-card{
  position:relative;
  overflow:hidden;
}
.about-card::before{
  content:"";
  position:absolute;
  width:280px;height:280px;
  right:-90px;top:-70px;
  border-radius:44% 56% 62% 38% / 48% 42% 58% 52%;
  background:linear-gradient(135deg,rgba(245,111,157,.16),rgba(156,108,218,.11));
  transform:rotate(18deg);
}
.about-card::after{
  content:"";
  position:absolute;
  width:220px;height:220px;
  left:-80px;bottom:-80px;
  border-radius:58% 42% 47% 53% / 39% 54% 46% 61%;
  background:linear-gradient(135deg,rgba(164,204,255,.16),rgba(156,108,218,.08));
  transform:rotate(-12deg);
}
.about-card>*{position:relative;z-index:2}

/* Folha ainda mais fina: curva local + queda suave */
.leaf{
  --edgeCurl:0px;
  --wave:0px;
  --droop:0deg;
}
.leaf.active{
  transform-style:preserve-3d;
}
.leaf.active .leaf-face{
  clip-path:polygon(
    0 0,
    calc(100% - var(--edgeCurl)) 0,
    100% 4%,
    calc(100% - var(--edgeCurl)*.30) 24%,
    100% 50%,
    calc(100% - var(--edgeCurl)*.22) 76%,
    100% 96%,
    calc(100% - var(--edgeCurl)) 100%,
    0 100%
  );
}
.leaf .leaf-front,
.leaf .leaf-back{
  transform-origin:center center;
}
.leaf.active .leaf-front{
  transform:
    translateZ(calc(3px + 14px * var(--turn)))
    skewY(calc(var(--skew) + var(--droop)));
}
.leaf.active .leaf-back{
  transform:
    rotateY(180deg)
    translateZ(calc(3px + 14px * var(--turn)))
    skewY(calc((var(--skew) + var(--droop))*-1));
}
.leaf::before{
  width:clamp(38px,9vw,142px);
  background:
    linear-gradient(90deg,
      rgba(30,21,48,.18),
      rgba(255,255,255,.72) 28%,
      rgba(255,255,255,.22) 52%,
      rgba(41,30,62,.14) 78%,
      transparent 100%);
}
.leaf::after{
  inset:-4% -5% -4% 52%;
  background:
    radial-gradient(ellipse at 95% 50%,rgba(255,255,255,.8) 0 10%,rgba(255,255,255,.24) 22%,rgba(41,30,62,.12) 48%,transparent 72%);
}


/* V5 — único ajuste solicitado: ocultar a marca FMU na captura de Tours */
.photo.tours-photo{
  --tour-logo-left:1.45%;
  --tour-logo-top:1.55%;
  --tour-logo-width:8.35%;
  --tour-logo-height:6.65%;
}
.photo.tours-photo .tour-shot{
  position:relative;
  z-index:3;
  width:88%;
  height:auto;
  aspect-ratio:1776 / 778;
  transform:rotate(-1.5deg) perspective(1400px) rotateY(-2deg) rotateX(.8deg);
  box-shadow:0 26px 54px rgba(33,27,58,.18),0 3px 0 rgba(255,255,255,.72) inset;
  clip-path:polygon(1.2% 2%,98.5% 0,100% 96.8%,97.5% 99%,2% 98.5%,0 3.5%);
}
.photo.tours-photo .tour-shot > img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:22px;
  transform:none;
  box-shadow:none;
  clip-path:none;
}
.photo.tours-photo .tour-logo-mask{
  position:absolute;
  left:var(--tour-logo-left);
  top:var(--tour-logo-top);
  width:var(--tour-logo-width);
  height:var(--tour-logo-height);
  background:#06151b;
  z-index:4;
  pointer-events:none;
}


/* V8 — lupa circular do jornal, inserida dentro da página Tours */
.photo.tours-photo .journal-zoom{
  position:absolute !important;
  z-index:30 !important;
  width:27% !important;
  aspect-ratio:1/1 !important;
  right:4% !important;
  top:7% !important;
  border-radius:50% !important;
  border:6px solid rgba(255,255,255,.98) !important;
  box-shadow:0 22px 48px rgba(25,20,45,.30),0 0 0 2px rgba(39,37,63,.12) !important;
  background-image:url("assets/imagem-01.webp") !important;
  background-repeat:no-repeat !important;
  background-size:310% auto !important;
  background-position:39% 39% !important;
  overflow:hidden !important;
  transform:rotate(2deg) !important;
  pointer-events:none !important;
}
.photo.tours-photo .journal-zoom::before{
  content:"JORNAL · DETALHE";
  position:absolute;
  left:50%;bottom:8px;transform:translateX(-50%);
  white-space:nowrap;
  padding:5px 9px;border-radius:999px;
  background:rgba(6,21,27,.86);color:#fff;
  font-size:.58rem;font-weight:900;letter-spacing:.08em;
  z-index:2;
}
.photo.tours-photo .journal-zoom::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 26px rgba(20,16,36,.12);pointer-events:none;
}


/* V9 — destaque circular Prática 360º, sem alterar o restante do design */
.practice360-zoom{
  position:absolute;
  z-index:24;
  width:29%;
  aspect-ratio:1 / 1;
  right:3.2%;
  top:4.6%;
  border-radius:50%;
  overflow:hidden;
  background:#fff;
  border:6px solid rgba(255,255,255,.98);
  box-shadow:
    0 22px 52px rgba(31,26,52,.28),
    0 0 0 2px rgba(39,37,63,.10);
  transform:rotate(2deg);
  pointer-events:none;
}
.practice360-zoom::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:inset 0 0 26px rgba(27,22,45,.10);
}
.practice360-zoom img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 44%;
  transform:scale(1.18);
  border-radius:0 !important;
  clip-path:none !important;
  box-shadow:none !important;
}


/* V10 — Página 02 com foto da Keise, mais leve e editorial */
.keise-cover{

/* V17B — virada de folha unificada: uma única física visual, sem misturar rígida + mole */
#leaf{
  --turn:0;
  --curl:0px;
  --lift:0px;
  --tilt:0deg;
  --edgeShade:0;
  overflow:visible !important;
  transform-style:preserve-3d !important;
  will-change:transform,filter;
  filter:none !important;
}
#leaf.active{
  visibility:visible !important;
  filter:
    drop-shadow(
      calc(-10px - 18px * var(--turn))
      calc(5px + 7px * var(--turn))
      calc(12px + 20px * var(--turn))
      rgba(38,29,61,calc(.08 + .14 * var(--turn)))
    ) !important;
}
#leaf.soft{
  transition:
    transform .78s cubic-bezier(.20,.70,.18,1),
    filter .78s ease !important;
}

/* A página deixa de parecer uma placa: a borda externa se retrai e curva,
   enquanto o miolo permanece mais estável. */
#leaf.active .leaf-face{
  overflow:hidden !important;
  clip-path:polygon(
    0 0,
    calc(100% - var(--curl)) 0,
    100% 7%,
    calc(100% - var(--curl)*.28) 28%,
    100% 50%,
    calc(100% - var(--curl)*.25) 72%,
    100% 93%,
    calc(100% - var(--curl)) 100%,
    0 100%
  ) !important;
  filter:none !important;
}
#leaf .leaf-front{
  transform:translateZ(1px) skewY(var(--tilt)) !important;
}
#leaf .leaf-back{
  transform:rotateY(180deg) translateZ(1px) skewY(calc(var(--tilt) * -1)) !important;
}

/* Reflexo estreito na dobra — um só, sem as três camadas anteriores. */
#leaf::before{
  content:"" !important;
  position:absolute !important;
  z-index:44 !important;
  top:0 !important;
  bottom:0 !important;
  right:calc(-2px - var(--curl)*.06) !important;
  width:clamp(24px,5vw,72px) !important;
  pointer-events:none !important;
  border-radius:58% 0 0 58% !important;
  opacity:calc(.10 + .55 * var(--turn)) !important;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.55) 35%,
    rgba(34,25,54,.10) 72%,
    transparent
  ) !important;
  transform:translateZ(10px) !important;
  filter:blur(.35px) !important;
}

/* Sombra suave projetada para baixo da folha. */
#leaf::after{
  content:"" !important;
  position:absolute !important;
  z-index:42 !important;
  inset:2% -3% 2% 62% !important;
  pointer-events:none !important;
  opacity:calc(.03 + .28 * var(--turn)) !important;
  background:radial-gradient(
    ellipse at 100% 50%,
    rgba(39,28,60,.16),
    rgba(39,28,60,.06) 35%,
    transparent 68%
  ) !important;
  transform:translateZ(-2px) !important;
}

/* Desativa a antiga faixa "paper-flex": era uma das causas do efeito duplicado. */
#leaf .paper-flex{
  display:none !important;
}

/* Mantém a lombada discreta e fixa; ela não deve girar com a folha. */
.magazine::after{
  width:10px !important;
  opacity:.52 !important;
  filter:blur(1.4px) !important;

<script>
(() => {
const pages = [

`
<div class="page">

      <h1>Portfólio<br><span>Design Educacional</span></h1>

    <div class="keise-portrait-zone">

      <div class="keise-photo-frame">
        <img src="assets/imagem-02.webp" alt="Keise Pâmela Morais">

      <div class="keise-note">
        <strong>Educação + Design + Tecnologia</strong>

</div>`,
`<div class="page about-thinking"><div class="about-thinking-inner">
<div class="about-intro"><div class="kicker">Sobre mim · Como eu penso</div><h2>Educação, design e tecnologia no mesmo lugar.</h2><p>Sou <strong>Keise Pâmela Morais</strong>, natural do Tocantins, apaixonada por educação, criatividade e pelas possibilidades de tornar a aprendizagem mais clara, acolhedora e envolvente.</p><p>Minha atuação conecta <strong>mediação pedagógica, design educacional, tecnologias educacionais, gamificação e experiência do aluno</strong>.</p><div class="chips"><span class="chip">Mediação Pedagógica</span><span class="chip">Gamificação</span><span class="chip">HTML interativo</span></div></div>
<div class="thinking-side"><div class="thinking-label">Meu olhar para o design educacional</div><h3>Bonito é bom.<br><em>Intencional é melhor.</em></h3><p>O visual chama atenção; a arquitetura da experiência sustenta a aprendizagem.</p><div class="thinking-cards"><div><b>Problema antes da ferramenta</b><span>Entender público, necessidade e contexto.</span></div><div><b>Interação com propósito</b><span>Cada ação precisa cumprir uma função pedagógica.</span></div><div><b>Aprender fazendo</b><span>Explorar, decidir, testar e receber feedback.</span></div></div></div>
</div><span class="page-no">02</span></div>`,

`<div class="page"><div class="copy"><div class="kicker">Case 01 · Gamificação</div><h2>Momento Responde Dúvidas</h2><p><strong>Desafio:</strong> transformar uma FAQ de atividades extensionistas em uma experiência de descoberta.</p><p><strong>Solução:</strong> jogo inspirado em brick breaker, com 17 dúvidas, progressão visual e painel lateral de respostas.</p><p><strong>Intencionalidade:</strong> substituir leitura passiva por exploração ativa, mantendo a informação disponível exatamente quando a dúvida é revelada.</p><div class="chips"><span class="chip">HTML/CSS/JS</span><span class="chip">Gamificação</span><span class="chip">Microinterações</span></div></div><span class="page-no">03</span></div>`,
`<div class="page"><div class="photo"><img src="assets/imagem-03.webp" alt="Tela do Momento Responde Dúvidas"><div class="detail-orbit"><img src="assets/imagem-03.webp" alt=""></div><div class="editorial-label">Gamificação · FAQ interativa</div></div><span class="page-no">04</span></div>`,
`<div class="page"><div class="copy"><div class="kicker">Case 02 · Simulação imersiva</div><h2>Escritório em Ação 360°</h2><p><strong>Desafio:</strong> aproximar a aprendizagem de Design de Interiores de uma situação profissional real.</p><p><strong>Solução:</strong> ambiente 360° com missão, briefing, cliente, objetos interativos e tomada de decisão.</p><p><strong>Intencionalidade:</strong> permitir prática contextualizada em ambiente seguro, com sequência de ações e feedback.</p><div class="chips"><span class="chip">Simulação</span><span class="chip">360°</span><span class="chip">Aprendizagem situada</span></div></div><span class="page-no">05</span></div>`,
`<div class="page"><div class="photo"><img src="assets/imagem-04.webp" alt="Escritório em Ação 360"><div class="detail-orbit"><img src="assets/imagem-04.webp" alt=""></div><div class="editorial-label">Simulação · Ambiente 360°</div></div>
<div class="practice360-zoom" aria-label="Destaque ampliado da Prática 360º">
  <img src="assets/imagem-05.webp" alt="Prática 360º — computador na estação de trabalho">
</div><span class="page-no">06</span></div>`,
`<div class="page"><div class="copy"><div class="kicker">Case 03 · Aprender decidindo</div><h2>Triagem das peças</h2><p><strong>Desafio:</strong> trabalhar conceitos de circularidade sem depender apenas de explicação textual.</p><p><strong>Solução:</strong> dinâmica de classificação de componentes entre reuso, reparo, remanufatura, reciclagem ou rejeito.</p><p><strong>Intencionalidade:</strong> transformar conceitos em critérios de decisão, com ação e conferência.</p><div class="chips"><span class="chip">Drag & drop</span><span class="chip">Feedback</span><span class="chip">Acessibilidade</span></div></div><span class="page-no">07</span></div>`,
`<div class="page"><div class="photo"><img src="assets/imagem-06.webp" alt="Triagem das peças"><div class="detail-orbit"><img src="assets/imagem-06.webp" alt=""></div><div class="editorial-label">Interação · Tomada de decisão</div></div><span class="page-no">08</span></div>`,
`<div class="page"><div class="copy"><div class="kicker">Case 04 · Pesquisa + reflexão</div><h2>Tours virtuais e negociação imobiliária</h2><p><strong>Desafio:</strong> integrar exploração de conteúdo, evidência de pesquisa e reflexão aplicada.</p><p><strong>Solução:</strong> ambiente visual com cards de exploração, recorte de pesquisa, progresso e contribuição do estudante.</p><p><strong>Intencionalidade:</strong> conduzir pequenas descobertas antes da pergunta reflexiva, criando contexto para uma resposta mais fundamentada.</p><div class="chips"><span class="chip">Curadoria</span><span class="chip">Reflexão</span><span class="chip">Experiência visual</span></div></div><span class="page-no">09</span></div>`,
`<div class="page"><div class="photo tours-photo">
<span class="tour-bg-spark s1">✦</span>
<span class="tour-bg-spark s2">✦</span>
<span class="tour-bg-ring"></span><div class="tour-shot"><img src="assets/imagem-01.webp" alt="Tours virtuais e negociação imobiliária"><span class="tour-logo-mask" aria-hidden="true"></span></div><div class="journal-zoom" aria-label="Ampliação do jornal"></div><div class="editorial-label">Pesquisa · Reflexão aplicada</div></div><span class="page-no">10</span></div>`,
`<div class="page"><div class="contact"><div class="kicker">Contato</div><h2>Keise Pâmela Morais</h2><div class="contact-row"><small>LinkedIn</small><a href="https://www.linkedin.com/in/keisepamelamorais/" target="_blank">linkedin.com/in/keisepamelamorais</a></div><div class="contact-row"><small>WhatsApp</small><a href="https://wa.me/5567993094401" target="_blank">+55 67 99309-4401</a></div></div><span class="page-no">11</span></div>`,
`<div class="page"><div class="about-card"><div class="kicker">Obrigada pela leitura</div><div class="quote">Projetar experiências é pensar no caminho inteiro.</div><p>Do primeiro contato com o conteúdo à ação, ao feedback e à reflexão.</p></div><span class="page-no">12</span></div>`
];

const left=document.getElementById('leftPage'), right=document.getElementById('rightPage');
const leaf=document.getElementById('leaf'), lf=document.getElementById('leafFront'), lb=document.getElementById('leafBack');
const prog=document.getElementById('prog'), count=document.getElementById('count'), mag=document.getElementById('magazine');
const prev=document.getElementById('prev'), next=document.getElementById('next'), sound=document.getElementById('sound');
let spread=0, soundOn=true, dragging=false, startX=0, startY=0, lastX=0, lastT=0, velocity=0, turn=0, mode='next';

function render(){
  left.innerHTML=pages[spread]||''; right.innerHTML=pages[spread+1]||'';
  const a=spread+1,b=Math.min(spread+2,pages.length);
  count.textContent=`${a}–${b} / ${pages.length}`;
  prog.style.width=`${(b/pages.length)*100}%`;
  prev.disabled=spread<=0; next.disabled=spread+2>=pages.length;
}
function paperSound(power=.9, duration=.36){
  if(!soundOn)return;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;

  const ctx=paperSound.ctx||(paperSound.ctx=new C());
  if(ctx.state==='suspended'){
    ctx.resume().catch(()=>{});
  }

  const now=ctx.currentTime;

  function makeRustle(delay, dur, gainAmount, lowFreq, highFreq){
    const len=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);

    let smoothed=0;
    for(let i=0;i<len;i++){
      const t=i/len;
      const raw=(Math.random()*2-1);
      smoothed=smoothed*.60+raw*.40;

      const attack=Math.min(1,t/.08);
      const release=Math.pow(1-t,1.35);
      const flutter=.78+.22*Math.sin(t*11*Math.PI+Math.sin(t*5.5)*1.1);

      d[i]=smoothed*attack*release*flutter;
    }

    const src=ctx.createBufferSource();
    src.buffer=buf;

    const hp=ctx.createBiquadFilter();
    hp.type='highpass';
    hp.frequency.value=lowFreq;

    const lp=ctx.createBiquadFilter();
    lp.type='lowpass';
    lp.frequency.value=highFreq;

    const gain=ctx.createGain();
    gain.gain.setValueAtTime(.0001,now+delay);
    gain.gain.exponentialRampToValueAtTime(gainAmount*power,now+delay+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);

    src.connect(hp).connect(lp).connect(gain).connect(ctx.destination);
    src.playbackRate.value=.96+Math.random()*.05;
    src.start(now+delay);
  }

  // Papel sendo puxado + assentando; sem tom de botão.
  makeRustle(0.00, Math.max(.20,duration*.72), .065, 180, 2400);
  makeRustle(0.12, Math.max(.16,duration*.50), .045, 240, 1850);
}
function setCurl(t, yBias=0){
  turn=Math.max(0,Math.min(1,t));

  // Curva máxima no meio da virada; desaparece quando a folha assenta.
  const arc=Math.sin(Math.PI*turn);
  const curl=arc*66;
  const lift=arc*42;
  const tilt=Math.max(-2.2,Math.min(2.2,yBias*2.2));

  leaf.style.setProperty('--turn',turn.toFixed(4));
  leaf.style.setProperty('--curl',curl.toFixed(2)+'px');
  leaf.style.setProperty('--lift',lift.toFixed(2)+'px');
  leaf.style.setProperty('--tilt',tilt.toFixed(2)+'deg');

  // Curva temporal suave: começa devagar ao "descolar" o canto,
  // acelera no meio e desacelera ao assentar.
  const eased=turn<.5
    ? 2*turn*turn
    : 1-Math.pow(-2*turn+2,2)/2;

  const angle=mode==='next' ? -180*eased : -180*(1-eased);
  const z=arc*58;
  const y=arc*Math.max(-12,Math.min(12,yBias*12));

  // Pequena compressão horizontal simula papel fino curvando,
  // sem a escala vertical exagerada da versão anterior.
  const scaleX=1-arc*.012;

  leaf.style.transform=
    `rotateY(${angle}deg) translateZ(${z}px) translateY(${y}px) scaleX(${scaleX})`;
}
function prepare(which){
  mode=which;
  if(which==='next'){
    if(spread+2>=pages.length)return false;
    lf.innerHTML=pages[spread+1]||'';lb.innerHTML=pages[spread+2]||'';
    leaf.style.left='50%';leaf.style.right='auto';leaf.style.transformOrigin='left center';setCurl(0,0);
  }else{
    if(spread<=0)return false;
    lf.innerHTML=pages[spread-1]||'';lb.innerHTML=pages[spread]||'';
    leaf.style.left='0';leaf.style.right='auto';leaf.style.transformOrigin='right center';setCurl(0,0);
  }
  leaf.classList.add('active');return true;
}
function settle(commit){
  leaf.classList.add('soft');
  const target=commit?1:0;
  setCurl(target,0);
  if(commit)paperSound(.92,.38);
  setTimeout(()=>{
    if(commit)spread += mode==='next'?2:-2;
    leaf.classList.remove('active','soft');leaf.style.transform='';render();
  },920);
}
function go(which){
  if(!prepare(which))return;
  requestAnimationFrame(()=>settle(true));
}
mag.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button'))return;
  const r=mag.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const outerZone=r.width*.28;
  if(x>=r.width-outerZone || x>=r.width*.5){
    if(!prepare('next'))return;
  }else{
    if(!prepare('prev'))return;
  }
  dragging=true;startX=lastX=e.clientX;startY=e.clientY;lastT=performance.now();velocity=0;
  leaf.classList.remove('soft');leaf.style.transition='none';leaf.setPointerCapture?.(e.pointerId);
  const edgeDist = mode==='next' ? (r.right-e.clientX) : (e.clientX-r.left);
  const initial=Math.max(0,Math.min(.08,(90-edgeDist)/900));
  setCurl(initial,(y/r.height-.5));
  paperSound(.62,.30);
});
mag.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const r=mag.getBoundingClientRect(),now=performance.now(),dt=Math.max(8,now-lastT);
  velocity=(e.clientX-lastX)/dt;lastX=e.clientX;lastT=now;
  const dx=e.clientX-startX;
  let t=mode==='next' ? -dx/(r.width*.48) : dx/(r.width*.48);
  t=Math.max(0,Math.min(1,t));
  const yBias=(e.clientY-startY)/(r.height*.55);
  setCurl(t,yBias);
});
function release(){
  if(!dragging)return;dragging=false;leaf.style.transition='';
  const flick=mode==='next'?velocity<-.38:velocity>.38;
  settle(turn>.31||flick);
}
mag.addEventListener('pointerup',release);mag.addEventListener('pointercancel',release);

function unlockPaperAudio(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=paperSound.ctx||(paperSound.ctx=new C());
  if(ctx.state==='suspended') ctx.resume().catch(()=>{});
  document.removeEventListener('pointerdown',unlockPaperAudio,true);
  document.removeEventListener('keydown',unlockPaperAudio,true);
}
document.addEventListener('pointerdown',unlockPaperAudio,true);
document.addEventListener('keydown',unlockPaperAudio,true);

next.onclick=()=>go('next');prev.onclick=()=>go('prev');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go('next');if(e.key==='ArrowLeft')go('prev')});
sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';if(soundOn)paperSound(.45,.28)};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
render();
})();
</script>
